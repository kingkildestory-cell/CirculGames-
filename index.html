<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Circul Gift — Инженерная Мастерская</title>
<script src="https://telegram.org"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
  body{
    background:#0d1017;
    background-image:radial-gradient(circle at 50% 0%,rgba(37,99,235,.22) 0%,transparent 65%),linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px);
    background-size:100% 100%,22px 22px,22px 22px;
    color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }
  #hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#131722;border-bottom:1px solid #1e2536;z-index:20}
  .u-pill{display:flex;align-items:center;gap:8px}
  #mascot{width:38px;height:38px;border-radius:50%;background:#1e3a8a;border:2px solid #38bdf8;image-rendering:pixelated}
  .bal-box{display:flex;align-items:center;gap:8px;background:#1b2030;padding:6px 12px;border-radius:14px;border:1px solid #2a334a;font-weight:900;font-size:14px}
  .plus-b{background:#3b82f6;color:#fff;border:none;border-radius:8px;width:22px;height:22px;font-weight:900;font-size:15px}
  #live-strip{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#11151f;border-bottom:1px solid #1e2536;overflow-x:auto}
  .live-tag{font-size:11px;font-weight:900;color:#10b981;display:flex;align-items:center;gap:4px;white-space:nowrap}
  .live-dot{width:7px;height:7px;background:#10b981;border-radius:50%;box-shadow:0 0 8px #10b981}
  .live-item{min-width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#1d263b,#131929);border:1px solid #2e3b59;display:flex;align-items:center;justify-content:center;font-size:22px}
  #view{flex:1;overflow-y:auto;padding:12px 12px 86px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
  .banner-rocket{background:linear-gradient(135deg,#0284c7 0%,#1d4ed8 60%,#1e1b4b 100%);border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;border:1px solid #38bdf8}
  .banner-pvp{background:linear-gradient(135deg,#f59e0b 0%,#d97706 55%,#78350f 100%);border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px solid #fcd34d}
  .banner-hub{background:linear-gradient(135deg,#6d28d9 0%,#3b82f6 60%,#0f172a 100%);border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px solid #818cf8}
  .hot-pill{display:inline-block;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:8px;font-size:10px;font-weight:900;margin-bottom:6px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card-g{border-radius:18px;padding:14px;min-height:135px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
  .card-g:active{transform:scale(.96)}
  .c-green{background:linear-gradient(155deg,#10b981,#047857)}
  .c-blue{background:linear-gradient(155deg,#0ea5e9,#1d4ed8)}
  .c-pink{background:linear-gradient(155deg,#d946ef,#86198f)}
  .c-purple{background:linear-gradient(155deg,#8b5cf6,#4c1d95)}
  .c-dark{background:linear-gradient(155deg,#1e293b,#0f172a);border-color:#334155}
  .c-orange{background:linear-gradient(155deg,#f97316,#b91c1c)}
  #nav{position:fixed;bottom:0;left:0;right:0;background:#131722;border-top:1px solid #1e2536;display:flex;justify-content:space-around;padding:8px 0 14px;z-index:30}
  .n-btn{background:none;border:none;color:#64748b;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
  .n-btn.act{color:#38bdf8} .n-btn i{font-style:normal;font-size:19px}
  #modal{position:fixed;inset:0;background:#0d1017;z-index:50;display:none;flex-direction:column}
  .m-top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:#131722;border-bottom:1px solid #1e2536}
  .m-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .hist-row{display:flex;gap:6px;width:100%;overflow-x:auto;padding-bottom:4px}
  .h-pill{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:900;background:#1b2030;border:1px solid #3b82f6;color:#93c5fd;white-space:nowrap}
  .h-pill.low{border-color:#ef4444;color:#fca5a5}
  .bet-btn{width:100%;padding:15px;border-radius:14px;border:none;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(90deg,#2563eb,#38bdf8)}
  .bet-btn.stop{background:linear-gradient(90deg,#e11d48,#f43f5e)}
  .bet-btn.win{background:linear-gradient(90deg,#059669,#10b981)}
  .panel{width:100%;background:#161b28;border:1px solid #263046;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .chip{background:#1f273b;border:1px solid #334155;color:#cbd5e1;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800}
  .chip.act{background:#3b82f6;color:#fff;border-color:#93c5fd}
  .grid5{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
  .cell5{height:52px;background:#1e2536;border:1px solid #334155;border-radius:11px;font-size:20px;color:#fff}
</style>
</head>
<body>
<div id="hud">
  <div class="u-pill"><canvas id="mascot" width="32" height="32"></canvas><div><div style="font-size:11px;color:#94a3b8">Ваш баланс</div><b id="uname" style="font-size:14px">Circul</b></div></div>
  <div class="bal-box">💎 <span id="bal">1500</span> <button type="button" class="plus-b" onclick="addFreeBonus()">+</button></div>
</div>
<div id="live-strip">
  <div class="live-tag"><span class="live-dot"></span>Live</div>
  <div class="live-item">🧸</div><div class="live-item">💎</div><div class="live-item">❤️</div><div class="live-item">💍</div><div class="live-item">🎂</div><div class="live-item">🎁</div>
</div>
<div id="view"></div>
<div id="nav">
  <button type="button" class="n-btn" data-t="bag"><i>🎒</i>Рюкзак</button>
  <button type="button" class="n-btn" data-t="inv"><i>👥</i>Друзья</button>
  <button type="button" class="n-btn act" data-t="home"><i>🏠</i>Главная</button>
  <button type="button" class="n-btn" data-t="top"><i>🏆</i>Топ</button>
  <button type="button" class="n-btn" data-t="earn"><i>🎯</i>Бонусы</button>
</div>
<div id="modal">
  <div class="m-top"><button type="button" class="chip" id="m-back">← Назад</button><b id="m-title">ИГРА</b><div class="bal-box" style="padding:4px 10px;font-size:12px">💎 <span id="m-bal">1500</span></div></div>
  <div class="m-body" id="m-body"></div>
</div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.expand();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u && u.first_name) document.getElementById('uname').innerText = u.first_name;
  }

  // Маскот-чертежница
  const mCtx = document.getElementById('mascot').getContext('2d');
  function drawMascot(m) {
    mCtx.clearRect(0,0,32,32);
    mCtx.fillStyle='#1d4ed8'; mCtx.fillRect(6,7,20,17); mCtx.fillRect(4,11,24,11);
    mCtx.fillStyle='#94a3b8'; mCtx.fillRect(19,2,6,2); mCtx.fillRect(18,4,2,4); mCtx.fillRect(24,4,2,4);
    mCtx.fillStyle='#fed7aa'; mCtx.fillRect(9,10,14,12);
    mCtx.fillStyle='#2563eb'; mCtx.fillRect(8,7,16,5); mCtx.fillRect(10,12,3,2); mCtx.fillRect(15,12,2,3); mCtx.fillRect(19,12,3,2);
    mCtx.fillStyle='#0284c7'; mCtx.fillRect(9,23,14,9); mCtx.fillStyle='#38bdf8'; mCtx.fillRect(12,24,8,8);
    if (m==='happy') {
      mCtx.fillStyle='#0f172a'; mCtx.fillRect(11,14,3,4); mCtx.fillRect(18,14,3,4);
      mCtx.fillStyle='#38bdf8'; mCtx.fillRect(11,16,3,2); mCtx.fillRect(18,16,3,2);
      mCtx.fillStyle='#f43f5e'; mCtx.fillRect(14,19,4,2);
    } else if (m==='sad') {
      mCtx.fillStyle='#0f172a'; mCtx.fillRect(10,15,4,1); mCtx.fillRect(18,15,4,1);
      mCtx.fillStyle='#38bdf8'; mCtx.fillRect(9,16,2,4); mCtx.fillRect(21,16,2,4);
      mCtx.fillStyle='#e11d48'; mCtx.fillRect(14,19,4,2);
    } else {
      mCtx.fillStyle='#0f172a'; mCtx.fillRect(11,14,3,3); mCtx.fillRect(18,14,3,3);
      mCtx.fillStyle='#f43f5e'; mCtx.fillRect(15,19,2,1); mCtx.fillStyle='#fff'; mCtx.fillRect(14,21,4,3);
    }
  }
  drawMascot('happy');

  // Сохранение баланса, подарков и рефералов
  let st = JSON.parse(localStorage.getItem('circul_epic_v1') || 'null') || {
    bal: 1500, inv: '🧸|Мишка|300,❤️|Сердце|500', refs: 0, refEarned: 0, refBy: ''
  };
  function saveSt() {
    localStorage.setItem('circul_epic_v1', JSON.stringify(st));
    document.getElementById('bal').innerText = Math.floor(st.bal);
    document.getElementById('m-bal').innerText = Math.floor(st.bal);
  }
  saveSt();

  // Реферальная система по Telegram ID и параметру start_param
  const uid = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id)
    ? String(tg.initDataUnsafe.user.id)
    : (localStorage.getItem('c_ref_uid') || (localStorage.setItem('c_ref_uid', Math.floor(100000+Math.random()*900000)), localStorage.getItem('c_ref_uid')));
  const refLink = 'https://t.me_' + uid;

  (function checkReferral() {
    const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('start') || '';
    if (param && param.startsWith('ref_') && !st.refBy && param !== 'ref_' + uid) {
      st.refBy = param;
      st.bal += 500;
      saveSt();
      setTimeout(() => alert('Вы зашли по приглашению друга! Начислен стартовый бонус +500 💎'), 400);
    }
  })();

  window.inviteFriend = () => {
    const shareUrl = 'https://t.me' + encodeURIComponent(refLink) + '&text=' + encodeURIComponent('Залетай в Мастерскую Циркуля! Лови +500 💎 по моей ссылке:');
    if (tg && tg.openTelegramLink) tg.openTelegramLink(shareUrl);
    else window.open(shareUrl, '_blank');
  };
  window.copyRefLink = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(refLink);
    alert('Реферальная ссылка скопирована:\n' + refLink);
  };
  window.addFreeBonus = () => { st.bal += 300; saveSt(); drawMascot('happy'); alert('Начислено +300 💎!'); };

  let curTab = 'home';
  const view = document.getElementById('view');
  document.querySelectorAll('.n-btn').forEach(b => {
    b.onclick = function() {
      document.querySelectorAll('.n-btn').forEach(x => x.classList.remove('act'));
      this.classList.add('act'); curTab = this.dataset.t; renderTab();
    };
  });

  function renderTab() {
    view.scrollTop = 0;
    if (curTab === 'home') {
      view.innerHTML = `
        <div class="banner-rocket" onclick="openGame('rocket')">
          <div><div class="hot-pill">🔥 HOT</div><h2 style="font-size:21px;font-weight:900">ROCKET ДУГА</h2><p style="font-size:12px;color:#bae6fd;margin-top:3px">Взлет грифеля циркуля до x50</p></div>
          <div style="font-size:52px">🚀</div>
        </div>
        <div class="banner-pvp" onclick="openGame('pvp_hub')">
          <div><div class="hot-pill">⚡ NEW PVP</div><h2 style="font-size:20px;font-weight:900">PVP HUB</h2><p style="font-size:12px;color:#fef3c7;margin-top:3px">Колесо Битвы · Лёд против Пламени</p></div>
          <div style="font-size:48px">⚔️</div>
        </div>
        <div class="banner-hub" onclick="openGame('play_hub')">
          <div><div class="hot-pill">🎮 6 РЕЖИМОВ</div><h2 style="font-size:20px;font-weight:900">PLAY HUB</h2><p style="font-size:12px;color:#ddd6fe;margin-top:3px">Upgrade · Mines · Spins · Plinko · Dice · Crafts</p></div>
          <div style="font-size:48px">🧭</div>
        </div>
        <div class="grid-2">
          <div class="card-g c-dark" onclick="openGame('free24')"><span style="font-size:11px;color:#f59e0b;font-weight:900">FREE 24</span><div style="font-size:42px;text-align:center">💍</div><b style="font-size:14px">Сундук Кольца</b></div>
          <div class="card-g c-purple" onclick="openGame('free')"><span style="font-size:11px;color:#e9d5ff;font-weight:900">FREE BONUS</span><div style="font-size:42px;text-align:center">🎂</div><b style="font-size:14px">Подарок Дня</b></div>
        </div>`;
    } else if (curTab === 'bag') {
      const shop = '🧸|Мишка|300,❤️|Сердце|500,💍|Кольцо|1200,🎁|Подарок|800,🎂|Тортик|1000'.split(',');
      const myItems = st.inv ? st.inv.split(',').filter(Boolean) : new Array();
      view.innerHTML = `<b style="font-size:16px">Мой рюкзак (${myItems.length})</b>
        <div class="grid-2">` + (myItems.length ? myItems.map((raw, idx) => {
          const p = raw.split('|');
          return `<div class="card-g c-dark" style="min-height:110px;align-items:center;text-align:center"><div style="font-size:36px">${p.at(0)}</div><b>${p.at(1)}</b><span style="font-size:11px;color:#38bdf8">💎 ${p.at(2)}</span></div>`;
        }).join('') : '<div style="grid-column:span 2;color:#94a3b8;font-size:12px">Рюкзак пуст — купи подарки ниже!</div>') + `</div>
        <b style="font-size:16px;margin-top:8px">Магазин подарков</b><div class="grid-2">` +
        shop.map(raw => {
          const p = raw.split('|');
          return `<div class="card-g c-blue" style="min-height:125px;align-items:center;text-align:center"><div style="font-size:40px">${p.at(0)}</div><b>${p.at(1)}</b><button type="button" class="chip act" style="width:100%" onclick="buyGift('${p.at(0)}','${p.at(1)}',${p.at(2)})">💎 ${p.at(2)}</button></div>`;
        }).join('') + `</div>`;
    } else if (curTab === 'inv') {
      view.innerHTML = `
        <div class="panel" style="gap:10px">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:46px;height:46px;border-radius:14px;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:24px">👥</div>
            <div><h3 style="font-size:17px">Получай 10% с друзей</h3><p style="font-size:12px;color:#94a3b8">+500 💎 за каждого приглашенного</p></div>
          </div>
          <button type="button" class="bet-btn" onclick="inviteFriend()">🔗 Пригласить друзей</button>
          <button type="button" class="chip" style="width:100%;padding:12px;text-align:center" onclick="copyRefLink()">📋 Копировать ссылку</button>
          <div style="font-size:10px;color:#64748b;word-break:break-all;text-align:center">${refLink}</div>
        </div>
        <div class="panel">
          <div style="display:flex;justify-content:space-between"><span style="color:#94a3b8">Заработано с рефералов</span><b style="color:#38bdf8">${st.refEarned} 💎</b></div>
          <div style="display:flex;justify-content:space-between"><span style="color:#94a3b8">Приглашено друзей</span><b>${st.refs}</b></div>
        </div>`;
    } else if (curTab === 'top') {
      view.innerHTML = `<div class="panel"><h3 style="margin-bottom:8px">🏆 Лидеры дня</h3>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #263046"><b>#1 @abcbbl</b><span style="color:#38bdf8;font-weight:900">+30 420 💎</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #263046"><b>#2 @juliboyev</b><span style="color:#94a3b8;font-weight:900">+14 100 💎</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0"><b>#3 Вы (${document.getElementById('uname').innerText})</b><span style="color:#10b981;font-weight:900">${Math.floor(st.bal)} 💎</span></div></div>`;
    } else {
      view.innerHTML = `<div class="panel" style="text-align:center"><h3>🎯 Ежедневные задания</h3><p style="font-size:12px;color:#94a3b8">Забирай награды и открывай бесплатные сундуки</p>
        <button type="button" class="bet-btn win" onclick="addFreeBonus()">Забрать +300 💎</button></div>`;
    }
  }

  window.buyGift = (i, n, c) => {
    if (st.bal < c) return alert('Не хватает 💎!');
    st.bal -= c; st.inv = st.inv ? (st.inv + ',' + i+'|'+n+'|'+c) : (i+'|'+n+'|'+c);
    saveSt(); renderTab(); drawMascot('happy'); alert('Подарок ' + i + ' ' + n + ' добавлен в Рюкзак!');
  };
  const modal = document.getElementById('modal'), mBody = document.getElementById('m-body'), mTitle = document.getElementById('m-title');
  let raf, stake = 50, rHist = '7.09x,1.04x,1.14x,3.39x,3.38x'.split(',');

  document.getElementById('m-back').onclick = () => { cancelAnimationFrame(raf); modal.style.display = 'none'; renderTab(); };

  function drawMiniCompass(ctx, px, py, tx, ty) {
    const hx = (px + tx) / 2 - 12, hy = (py + ty) / 2 - 50;
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(px, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.fill();
  }

  window.openGame = (g) => {
    cancelAnimationFrame(raf); modal.style.display = 'flex';
    if (g === 'play_hub') {
      mTitle.innerText = 'PLAY HUB';
      mBody.innerHTML = `
        <div class="card-g c-green" style="width:100%" onclick="openGame('upgrade')"><span class="hot-pill">🔥 HOT</span><h3>Upgrade</h3><p style="font-size:12px">Прокачай подарок или очки на колесе</p></div>
        <div class="grid-2" style="width:100%">
          <div class="card-g c-blue" onclick="openGame('mines')"><h3>Mines 5x5</h3><p style="font-size:11px">25 клеток, до 560x</p></div>
          <div class="card-g c-pink" onclick="openGame('spins')"><h3>Spins 5x5</h3><p style="font-size:11px">Барабан подарков</p></div>
          <div class="card-g c-purple" onclick="openGame('plinko')"><h3>Plinko</h3><p style="font-size:11px">Пирамида до 33x</p></div>
          <div class="card-g c-dark" onclick="openGame('dice')"><h3>Dice 0-100</h3><p style="font-size:11px">Больше или меньше</p></div>
        </div>
        <div class="card-g c-orange" style="width:100%" onclick="openGame('crafts')"><h3>Crafts</h3><p style="font-size:12px">Объедини 2+ подарка в новый (до x100)</p></div>`;
    } else if (g === 'pvp_hub') {
      mTitle.innerText = 'PVP HUB';
      mBody.innerHTML = `
        <div class="card-g c-blue" style="width:100%" onclick="openGame('battle')"><h3>🎡 Колесо Битвы</h3><p style="font-size:12px">Общий банк раунда, побеждает выбранный сектор</p></div>
        <div class="card-g c-orange" style="width:100%" onclick="openGame('icefire')"><h3>❄️ Лёд против Пламени 🔥</h3><p style="font-size:12px">Командная дуэль стихий 50/50</p></div>`;
    } else if (g === 'rocket') {
      mTitle.innerText = 'ROCKET ДУГА';
      mBody.innerHTML = `
        <div style="position:relative;width:100%">
          <canvas id="rk-cvs" width="330" height="210" style="width:100%;background:#11151f;border-radius:16px;border:1px solid #1e293b"></canvas>
          <div id="rk-x" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#818cf8">1.00x</div>
        </div>
        <div class="hist-row" id="rk-hist">${rHist.map(x => `<span class="h-pill ${parseFloat(x)<1.5?'low':''}">${x}</span>`).join('')}</div>
        <div class="panel">

          ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(25, 185); ctx.quadraticCurveTo(165, 185, tx, ty); ctx.stroke();
          drawMiniCompass(ctx, tx - 20, ty + 25, tx, ty);

      ctx.fillStyle = '#fff'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('POOL', 130, 129);
      drawMiniCompass(ctx, 130, 125, 130 + Math.cos(rot)*92, 125 + Math.sin(rot)*92);
    }

          saveSt(); drawMascot('happy'); alert('Крафт успешен! Создан предмет: ' + prize.split('|').at(0) + ' ' + prize.split('|').at(1));
        } else { saveSt(); drawMascot('sad'); alert('Крафт не удался — предметы сгорели при сборке!'); }
        openGame('crafts');
      };
    }
  }

  function initPlinko(mults) {
    const c = document.getElementById('pl-cvs'), ctx = c.getContext('2d');
    function drawPins(ball) {
      ctx.clearRect(0,0,320,230);
      ctx.fillStyle = '#e0e7ff';
      for (let r = 2; r < 10; r++) {
        for (let i = 0; i <= r; i++) {
          const x = 160 + (i - r / 2) * 26, y = 20 + r * 20;
          ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (ball) { ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2); ctx.fill(); }
    }
    drawPins(null);
    document.getElementById('pl-btn').onclick = () => {
      if (st.bal < stake) return alert('Мало 💎!'); st.bal -= stake; saveSt();
      let bx = 160, by = 25, step = 0, idx = 4;
      const t = setInterval(() => {
        step++; const dir = Math.random() < 0.5 ? -1 : 1;
        bx += dir * 13; by += 22;
        if (dir > 0 && step % 2 === 0) idx = Math.min(8, idx + 1);
        if (dir < 0 && step % 2 === 0) idx = Math.max(0, idx - 1);
        drawPins({ x: bx, y: by });
        if (step >= 8) {
          clearInterval(t);
          const m = mults.at(idx), w = Math.round(stake * m);
          st.bal += w; saveSt(); if (m >= 1) drawMascot('happy'); else drawMascot('sad');
          drawPins(null);
        }
      }, 65);
    };
  }

  renderTab();
</script>

    if (gSt.bal < cfg.cost) return alert('Не хватает GRAM! Нажмите + вверху для пополнения.');
    gSt.bal -= cfg.cost;
    localStorage.setItem('circul_gram_v1', JSON.stringify(gSt));
    window.syncGramUI();

    const pool = window.TG_NFTS.filter(n => n.price >= cfg.min && n.price <= cfg.max);
    const winNft = pool[Math.floor(Math.random() * pool.length)] || window.TG_NFTS;
    const track = document.getElementById('case-track');
    const winIdx = 28;
    let html = '';
    for (let i = 0; i < 35; i++) {
      const item = (i === winIdx) ? winNft : pool[Math.floor(Math.random() * pool.length)];
      const rCls = item.rar === 'Legendary' ? 'leg' : (item.rar === 'Epic' ? 'ep' : '');
      html += `<div class="case-slot ${rCls}"><div style="font-size:32px">${item.ico}</div><div style="font-size:9px;font-weight:800;color:#bae6fd">${item.price.toFixed(2)}</div></div>`;
    }
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    track.innerHTML = html;

    const targetX = -(winIdx * 94 + 43 + (Math.floor(Math.random() * 40) - 20));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      track.style.transition = 'transform 4.2s cubic-bezier(0.08, 0.88, 0.16, 1)';
      track.style.transform = 'translateX(' + targetX + 'px)';
    }));

    document.getElementById('case-res').innerText = '⚡ Вращение портала...';
    setTimeout(() => {
      gSt = JSON.parse(localStorage.getItem('circul_gram_v1') || '{"bal":50,"inv":""}');
      const entry = winNft.ico + '|' + winNft.name + '|' + winNft.price.toFixed(2);
      gSt.inv = gSt.inv ? (gSt.inv + ',' + entry) : entry;
      localStorage.setItem('circul_gram_v1', JSON.stringify(gSt));
      window.syncGramUI();
      document.getElementById('case-res').innerHTML = '✨ Выпал: ' + winNft.ico + ' <b>' + winNft.name + '</b> (' + winNft.price.toFixed(2) + ' GRAM)!';
      const vp = document.getElementById('case-vp');
      if (vp) { vp.classList.remove('shake-anim'); void vp.offsetWidth; vp.classList.add('shake-anim'); }
    }, 4350);
  };

  // Аниме-аура вращающихся рун циркуля на всех игровых канвасах
  let animeAngle = 0;
  setInterval(() => {
    const cvs = document.querySelector('#m-body canvas');
    if (!cvs) return;
    const ctx = cvs.getContext('2d'), cx = cvs.width / 2, cy = cvs.height / 2;
    animeAngle += 0.08;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(animeAngle);
    ctx.strokeStyle = 'rgba(0, 245, 212, 0.22)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([10, 6]);
    ctx.beginPath(); ctx.arc(0, 0, Math.min(cx, cy) - 10, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }, 40);

  window.syncGramUI();
})();
</script>
